artifact_schema_version: 1

provider:
  kind: gemini
  model: gemini-3.6-flash
  api_key_env: GEMINI_API_KEY
  temperature: 0.0
  max_output_tokens: 8192

workflow:
  max_html_bytes: 5000000
  max_repair_attempts: 2

execution:
  timeout_seconds: 5.0
  memory_mb: 512
  max_source_bytes: 100000
  max_output_bytes: 16384

diagnostics:
  enabled: true
  model: gemini-3.6-flash
