artifact_schema_version: 3
baseline_prompt: prompts/dart-qa-baseline.md

target_provider:
  kind: ollama
  model: gpt-oss:120b
  api_key_env: OLLAMA_API_KEY
  base_url: https://ollama.com
  request_timeout_seconds: 300
  temperature: 0.0
  max_output_tokens: 8192

optimizer_provider:
  kind: ollama
  model: gpt-oss:120b
  api_key_env: OLLAMA_API_KEY
  base_url: https://ollama.com
  request_timeout_seconds: 300
  temperature: 0.0
  max_output_tokens: 8192

target_limits:
  max_requests: 200
  max_attempts: 200
  max_input_tokens: 2000000
  max_output_tokens: 100000
  max_wall_seconds: 7200

optimizer_limits:
  max_requests: 4
  max_attempts: 4
  max_input_tokens: 100000
  max_output_tokens: 20000
  max_wall_seconds: 1800

selection:
  min_mean_improvement: 0.01

dataset:
  split_counts: {}
  minimum_tag_counts: {}

workflow:
  max_html_bytes: 5000000
