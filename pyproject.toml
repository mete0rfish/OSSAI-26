[project]
name = "dart-parser-workflow"
version = "0.1.0"
description = "Gemini로 DART 공시 HTML 파서를 생성하고 검증하는 실험용 워크플로"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "deepeval>=4.1,<5",
  "google-genai>=1.55,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.14,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dart_parser_workflow"]

[tool.pytest.ini_options]
addopts = "-q -p no:rerunfailures"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
